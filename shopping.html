<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cool Shop</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />

  <style>
    /* Custom CSS: swap image on hover and scale it slightly */
    .product-img {
      transition: transform 0.3s ease;
      width: 100%;
      height: 220px;
      object-fit: cover;
    }
    .product-card:hover .product-img {
      transform: scale(1.08);
    }
    .product-card {
      margin-bottom: 30px;
      text-align: center;
    }
    footer {
      background-color: #212529;
      color: #fff;
      padding: 30px 0;
      margin-top: 40px;
    }
    .footer-logo {
      height: 60px;
      width: auto;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="text-center my-4">Cool Shop</h1>
    <p class="text-center mb-4">Browse our products below</p>

    <!-- Row 1: Products 1-4 -->
    <div class="row">
      <div class="col-md-3 product-card">
        <img src="headphones.jpg" class="img-fluid product-img" alt="Product 1">
        <h5>Wireless Headphones</h5>
        <p>R49.99</p>
        <button class="btn btn-primary">Buy</button>
      </div>
      <div class="col-md-3 product-card">
        <img src="shoes.jpg" class="img-fluid product-img" alt="Product 2">
        <h5>Running Shoes</h5>
        <p>R79.99</p>
        <button class="btn btn-primary">Buy</button>
      </div>
      <div class="col-md-3 product-card">
        <img src="coffee.jpg" class="img-fluid product-img" alt="Product 3">
        <h5>Coffee Mug</h5>
        <p>R12.50</p>
        <button class="btn btn-primary">Buy</button>
      </div>
      <div class="col-md-3 product-card">
        <img src="backpack.jpg" class="img-fluid product-img" alt="Product 4">
        <h5>Backpack</h5>
        <p>R59.99</p>
        <button class="btn btn-primary">Buy</button>
      </div>
    </div>

    <!-- Row 2: Products 5-8 -->
    <div class="row">
      <div class="col-md-3 product-card">
        <img src="lamp.jpg" class="img-fluid product-img" alt="Product 5">
        <h5>Desk Lamp</h5>
        <p>R24.99</p>
        <button class="btn btn-primary">Buy</button>
      </div>
      <div class="col-md-3 product-card">
        <img src="sunglasses.jpg" class="img-fluid product-img" alt="Product 6">
        <h5>Sunglasses</h5>
        <p>R34.99</p>
        <button class="btn btn-primary">Buy</button>
      </div>
      <div class="col-md-3 product-card">
        <img src="waterbottle.jpg" class="img-fluid product-img" alt="Product 7">
        <h5>Water Bottle</h5>
        <p>R15.00</p>
        <button class="btn btn-primary">Buy</button>
      </div>
      <div class="col-md-3 product-card">
        <img src="speaker.jpg" class="img-fluid product-img" alt="Product 8">
        <h5>Bluetooth Speaker</h5>
        <p>R45.00</p>
        <button class="btn btn-primary">Buy</button>
      </div>
    </div>

    <!-- Row 3: Products 9-10 -->
    <div class="row">
      <div class="col-md-3 product-card">
        <img src="notebook.jpg" class="img-fluid product-img" alt="Product 9">
        <h5>Notebook Set</h5>
        <p>R9.99</p>
        <button class="btn btn-primary">Buy</button>
      </div>
      <div class="col-md-3 product-card">
        <img src="clock.jpg" class="img-fluid product-img" alt="Product 10">
        <h5>Table Clock</h5>
        <p>R19.99</p>
        <button class="btn btn-primary">Buy</button>
      </div>
    </div>
  </div>

  <!-- Footer with horizontal contact form and company logo -->
  <footer>
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-2 text-center mb-3 mb-md-0">
          <img src="logo.svg" class="img-fluid footer-logo" alt="Cool Shop logo">
        </div>
        <div class="col-md-10">
          <form class="row row-cols-lg-auto g-2 align-items-center">
            <div class="col-12">
              <label class="visually-hidden" for="name">Name</label>
              <input type="text" class="form-control" id="name" placeholder="Your name">
            </div>
            <div class="col-12">
              <label class="visually-hidden" for="email">Email</label>
              <input type="email" class="form-control" id="email" placeholder="Your email">
            </div>
            <div class="col-12">
              <label class="visually-hidden" for="phone">Phone</label>
              <input type="tel" class="form-control" id="phone" placeholder="Phone number">
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-success">Contact Us</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </footer>

  <!-- Bootstrap JS bundle -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
</body>
</html>
